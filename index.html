<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام تقييم الأعضاء - بيت التطوع، جامعة دمنهور</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1b3a;--blue:#1a62c4;--gold:#f2a33a;--gold-t:#8a5a0a;--bg:#eef2f8;--card:#fff;--soft:#f4f7fb;--line:#d9e1ee;--tx:#14203a;--mut:#5a6987;--bad:#c93a3a;--fd:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif}
@media(prefers-color-scheme:dark){:root{--blue:#3b82e0;--gold-t:#f2b45a;--bg:#08101f;--card:#0f1b33;--soft:#0b1730;--line:#223357;--tx:#e8eefb;--mut:#9db0d3;--bad:#ff8080}}
*{box-sizing:border-box}
body{margin:0;font:400 16px/1.75 "IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--fd);line-height:1.5}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 22px;border-bottom:2px solid var(--gold)}
header img{width:46px;height:46px;border-radius:50%;border:2px solid #ffffff33;background:#fff}
.brand{flex:1;min-width:0;line-height:1.4}
.brand h1{font-size:1.05rem;font-weight:800;margin:0}
.brand p{margin:0;font-size:.8rem;color:#b9c6e2}
main{flex:1;padding:24px 16px}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:18px;border-top:1px solid var(--line)}
.wrap{max-width:900px;margin:auto;display:grid;gap:16px}
.wrap>*{min-width:0}
.wide{max-width:1300px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h3{margin:0 0 12px;font-size:1.05rem}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:8px 16px;background:var(--blue);color:#fff;font-weight:600;transition:background-color .15s,border-color .15s}
button:hover{background:#154f9f}
button.g{background:transparent;border-color:var(--line);color:var(--tx)}
button.g:hover{background:var(--soft);border-color:var(--mut)}
header button.g{color:#fff;border-color:#ffffff59}
header button.g:hover{background:#ffffff1a}
button.ic{padding:6px 8px;line-height:0}
button.ic svg{width:18px;height:18px}
button.dng:hover{color:var(--bad);border-color:var(--bad)}
input,textarea{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
input:focus,textarea:focus{border-color:var(--blue)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:grid;gap:6px;font-weight:600;font-size:.9rem}
.err{color:var(--bad);min-height:1.5em;margin:0;font-size:.9rem}
.mut{color:var(--mut);margin:0}
.login{display:grid;grid-template-columns:1fr 1fr;max-width:820px;margin:28px auto;padding:0;overflow:hidden;border-radius:16px;box-shadow:0 14px 40px -18px #0b1b3a88}
.login .side{background:var(--ink);color:#fff;padding:40px 28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.login .side img{width:120px;height:120px;border-radius:50%;border:3px solid var(--gold);background:#fff}
.login .side h2{margin:16px 0 2px;font-size:1.35rem}
.login .side p{margin:0;color:#b9c6e2}
.login .form{padding:40px 30px;display:grid;gap:14px;align-content:center;text-align:right}
.login h3{margin:0 0 4px;font-size:1.2rem}
@media(max-width:700px){.login{grid-template-columns:1fr;margin:8px auto}.login .side{padding:24px}.login .side img{width:84px;height:84px}.login .form{padding:26px 20px}}
.hero{display:flex;flex-wrap:wrap;gap:20px 32px;justify-content:space-between;align-items:center;background:var(--ink);border-color:var(--ink);color:#fff;padding:28px}
.hero .mut{color:#b9c6e2}
.hero h2{margin:2px 0 6px;font-size:1.6rem}
.score{display:flex;align-items:center;gap:26px}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:#ffffff26}
.ring .pg{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:var(--o);animation:fill 1.1s .15s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes fill{from{stroke-dashoffset:326.7}}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.2}
.ring b{font:800 2.5rem var(--fd)}
.ring span{font-size:.8rem;color:#b9c6e2}
.kv{display:grid;gap:12px}
.kv div{padding:2px 16px;border-inline-start:3px solid #ffffff33}
.kv b{display:block;font:800 1.5rem/1.3 var(--fd)}
.kv span{font-size:.82rem;color:#b9c6e2}
.row{display:grid;grid-template-columns:170px 1fr 84px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0;padding-bottom:0}
.row b{text-align:end;font-weight:600}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--blue)}
.nt{border-inline-start:4px solid var(--gold)}
.nt p{margin:0}
@media(max-width:560px){.row{grid-template-columns:1fr auto}.row .bar{grid-column:1/-1;order:3}.score{width:100%;justify-content:space-between}.ring{width:128px;height:128px}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);padding:0;overflow:hidden}
.kpis div{padding:16px 22px;border-inline-start:1px solid var(--line)}
.kpis div:first-child{border:0}
.kpis b{display:block;font:800 1.7rem/1.4 var(--fd)}
.kpis span{color:var(--mut);font-size:.85rem}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.kpis div:nth-child(3){border-inline-start:0}.kpis div:nth-child(n+3){border-top:1px solid var(--line)}}
.warn{display:flex;gap:10px;align-items:flex-start;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--card))}
.warn svg{flex:none;width:22px;height:22px;margin-top:3px;color:var(--gold-t)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{max-width:240px}
.tw{overflow:auto;max-height:75vh;margin-top:14px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--ink);color:#fff;font-weight:600;position:sticky;top:0;z-index:2}
th small{color:#b9c6e2;font-weight:400}
tbody tr{background:var(--card)}
tbody tr:nth-child(even){background:var(--soft)}
tbody tr:hover{background:color-mix(in srgb,var(--blue) 9%,var(--card))}
tbody tr:last-child td{border-bottom:0}
.c1{right:0;width:44px;min-width:44px;max-width:44px}
.c2{right:44px;box-shadow:-1px 0 0 var(--line)}
td.c1,td.c2{position:sticky;background:inherit;z-index:1}
th.c1,th.c2{z-index:3}
td input{width:64px;text-align:center;padding:5px;background:var(--card)}
td input.note{width:160px;text-align:right}
td.nm{text-align:right;min-width:180px;font-weight:600}
td.nm small{display:block;color:var(--mut);font-weight:400}
td.tt,td.rk{font-weight:700}
td.rk{color:var(--gold-t)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:3px 6px 3px 14px;background:var(--soft)}
.chip button{padding:3px 6px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--tx);max-width:560px;width:92%;padding:24px;box-shadow:0 24px 60px -20px #000a}
dialog::backdrop{background:#0b1b3a99}
dialog h3{margin:0 0 6px}
dialog textarea{height:150px;direction:ltr;font:.85rem monospace;margin-top:12px}
#toast{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;border:1px solid #ffffff2e;box-shadow:0 8px 24px -8px #0009;z-index:50}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
a.btn{display:inline-block;text-decoration:none;border:1px solid #ffffff59;border-radius:8px;padding:8px 18px;color:#fff;font-weight:600;transition:background-color .15s}
a.btn:hover{background:#ffffff1a}
a.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
a.btn.gold:hover{background:#f7b55a}
.lp{background:var(--ink);color:#fff;border-radius:16px;padding:48px 28px;text-align:center}
.lp h2{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.2rem)}
.lp p{margin:0 auto 24px;max-width:46ch;color:#b9c6e2}
.tm h3{margin:14px 0 2px;font-size:1.2rem}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;direction:ltr;margin-top:6px}
.pc{margin:0;position:relative;overflow:hidden;border-radius:14px;aspect-ratio:4/5;background:var(--ink);direction:rtl;text-align:right}
.pc:nth-child(2){transform:translateY(-14px)}
.pc img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.pc::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:var(--gold)}
.pc figcaption{position:absolute;inset:auto 0 0;padding:48px 18px 20px;background:linear-gradient(transparent,#0b1b3af2 62%);color:#fff;display:grid;gap:2px;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s}
.pc figcaption b{font:800 1.1rem var(--fd)}
.pc figcaption span{font-size:.88rem;color:#d3dcef;line-height:1.6}
.pc:hover figcaption,.pc:focus-within figcaption,.pc:focus-visible figcaption{opacity:1;transform:none}
.pc:hover img,.pc:focus-visible img{transform:scale(1.04)}
@media(hover:none){.pc figcaption{opacity:1;transform:none}.hint{display:none}}
@media(max-width:760px){.team{grid-template-columns:1fr;max-width:380px;margin-inline:auto}.pc:nth-child(2){transform:none}}
</style>
</head>
<body>
<header>
<img id="hl" alt="شعار بيت التطوع">
<div class="brand"><h1>بيت التطوع</h1><p>جامعة دمنهور - نظام تقييم الأعضاء</p></div>
<a id="in" class="btn" href="#login">تسجيل الدخول</a>
<button id="out" class="g" hidden onclick="logout()">تسجيل الخروج</button>
</header>
<main id="app"></main>
<footer>بيت التطوع - جامعة دمنهور</footer>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg">
<h3>بيانات الدخول</h3>
<p class="mut">كل سطر: الاسم، رقم التسجيل، كلمة المرور. انسخها الآن وأرسلها لكل عضو، فكلمة المرور لا تظهر مرة أخرى (يمكنك توليد كلمة جديدة بزر المفتاح).</p>
<textarea id="dc" readonly></textarea>
<p class="tools"><button onclick="navigator.clipboard.writeText($('#dc').value).then(()=>this.textContent='تم النسخ ✓')">نسخ</button><button class="g" onclick="$('#dlg').close()">إغلاق</button></p>
</dialog>

const TEAM=[["الدكتور إبراهيم عسكر","مدير عام إدارة البرامج الوقائية بصندوق مكافحة وعلاج الإدمان والتعاطي","50% 0"],["الأستاذ الدكتور عمرو عثمان","مساعد الوزير، مدير عام صندوق مكافحة وعلاج الإدمان والتعاطي","70% 0"],["الدكتور وائل العبد","مشرف عام محافظة البحيرة، صندوق مكافحة وعلاج الإدمان والتعاطي","50% 70%"]];
const homeView=()=>`<section class="wrap wide"><div class="lp"><h2>بيت التطوع - جامعة دمنهور</h2><p>منصة تقييم الأعضاء: تابع درجاتك وترتيبك في مكان واحد.</p><a class="btn gold" href="#login" onclick="return nav('login')">تسجيل الدخول</a></div>
<div class="tm"><h3>قيادات صندوق مكافحة وعلاج الإدمان والتعاطي</h3><p class="mut hint">مرّر المؤشر على الصورة لمعرفة التفاصيل</p></div>
<div class="team">${TEAM.map((p,i)=>`<figure class="pc" tabindex="0"><img src="${PH[i]}" alt="${p[0]}" style="object-position:${p[2]}"><figcaption><b>${p[0]}</b><span>${p[1]}</span></figcaption></figure>`).join('')}</div></section>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nd=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const H=async p=>{if(!(window.crypto&&crypto.subtle))return'p:'+p;const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bt:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
const pw=()=>{const a='abcdefghjkmnpqrstuvwxyz23456789';return Array.from(crypto.getRandomValues(new Uint8Array(7)),x=>a[x%a.length]).join('')};
const newId=()=>{let i;do i=String(10000+Math.floor(Math.random()*90000));while(DB.members.some(m=>m.id===i));return i};
const fm=id=>DB.members.find(m=>m.id===id);
const tot=m=>m.s.some(v=>v!=null)?Math.round(m.s.reduce((a,v)=>a+(+v||0),0)*100)/100:null;
const gpa=t=>(Math.round(t/MAXT*500)/100).toFixed(2);
/* الترتيب: المجاميع المتساوية تأخذ نفس الترتيب، والمجموع الذي يليها يأخذ الرقم التالي مباشرة (1،2،2،3،4...) */
const rank=m=>{const t=tot(m);return t==null?'':1+new Set(DB.members.map(tot).filter(x=>x!=null&&x>t)).size};
const byName=(a,b)=>a.n.localeCompare(b.n,'ar',{sensitivity:'base',numeric:true})||a.id.localeCompare(b.id);
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t.k);t.k=setTimeout(()=>t.hidden=true,3500)};

/* ترحيل البيانات القديمة (7 بنود): حذف عمود «حضور سيشن» القديم (الرابع) مع إبقاء بقية الدرجات في أماكنها */
function migrate(){let c=false;DB.members.forEach(m=>{if(m.s.length==7){m.s.splice(3,1);c=true}m.s=m.s.map((v,i)=>v==null?null:Math.min(v,CRIT[i][1]))});return c}
async function save(){const j=JSON.stringify(DB);try{if(db)await db.set({json:j});else localStorage.setItem('bt_db',j)}catch(e){toast('تعذر الحفظ: '+e.message)}}

async function init(){
 $('#hl').src=LOGO;
 const l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.append(l);
 try{S=JSON.parse(sessionStorage.getItem('bt_s'))}catch(e){}
 if(!S)render();
 if(FB&&typeof firebase!=='undefined'){
  try{
   firebase.initializeApp(FB);db=firebase.firestore().collection('app').doc('data');
   const s=await db.get();if(s.exists)DB=JSON.parse(s.data().json);
   db.onSnapshot(s=>{if(s.exists){DB=JSON.parse(s.data().json);if(migrate())save();if(!document.activeElement.matches('input,textarea'))render()}});
  }catch(e){db=null;toast('تعذر الاتصال بـ Firebase، سيُستخدم التخزين المحلي')}
 }
 if(!db)try{DB=JSON.parse(localStorage.getItem('bt_db'))||DB}catch(e){}
 if(migrate())await save();
 if(!DB.admins.length){DB.admins=[{u:'admin',p:await H('admin123')}];await save()}
 render();
}

function render(){
 if(S){const ok=S.role=='admin'?DB.admins.some(a=>a.u==S.id):DB.members.some(m=>m.id==S.id);if(!ok)S=null}
 $('#out').hidden=!S;
 const lg=V=='login',ln=$('#in');ln.onclick=()=>nav(lg?'':'login');ln.hidden=!!S;ln.textContent=lg?'الرئيسية':'تسجيل الدخول';ln.href=lg?'#':'#login';
 $('#app').innerHTML=!S?(lg?loginView():homeView()):S.role=='admin'?adminView():memberView(fm(S.id));
 if(S&&S.role=='admin')kpi();
}
function logout(){S=null;try{sessionStorage.removeItem('bt_s')}catch(e){}V='';try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}render()}
async function go(){
 const u=nd($('#u').value.trim()),p=await H($('#p').value);
 const role=DB.admins.some(a=>a.u===u&&a.p===p)?'admin':DB.members.some(m=>m.id===u&&m.p===p)?'member':null;
 if(!role){ERR='اسم المستخدم أو كلمة المرور غير صحيحة';$('.err').textContent=ERR;return}
 ERR='';S={role,id:u};try{sessionStorage.setItem('bt_s',JSON.stringify(S))}catch(e){}render();
}

const loginView=()=>`<div class="card login"><div class="side"><img src="${LOGO}" alt=""><h2>بيت التطوع</h2><p>جامعة دمنهور</p></div>
<div class="form"><div><h3>تسجيل الدخول</h3><p class="mut">الأعضاء يدخلون برقم التسجيل، والمسؤولون باسم المستخدم.</p></div>
<label>رقم التسجيل أو اسم المستخدم<input id="u" autocomplete="username" onkeydown="if(event.key==='Enter')$('#p').focus()"></label>
<label>كلمة المرور<input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')go()"></label>
<p class="err" role="alert">${ERR}</p><button type="button" onclick="go()">دخول</button></div></div>`;

function memberView(m){
 const t=tot(m),r=rank(m),n=DB.members.filter(o=>tot(o)!=null).length,o=(326.7*(1-(t||0)/MAXT)).toFixed(1);
 return `<section class="wrap">
<div class="card hero"><div><p class="mut">أهلاً بك</p><h2>${esc(m.n)}</h2><p class="mut">رقم التسجيل: <b>${m.id}</b></p></div>
<div class="score"><div class="ring" role="img" aria-label="المجموع ${t??'—'} من ${MAXT}"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" cx="60" cy="60" r="52" style="--o:${o}"/></svg><div class="in"><b>${t??'—'}</b><span>من ${MAXT}</span></div></div>
<div class="kv"><div><b>${t==null?'—':gpa(t)}</b><span>المعدل من 5</span></div><div><b>${r||'—'}</b><span>الترتيب من ${n}</span></div></div></div></div>
<div class="card"><h3>تفاصيل الدرجات</h3>${CRIT.map((c,i)=>{const v=m.s[i];return `<div class="row"><span>${c[0]}</span><div class="bar"><i style="width:${v==null?0:v/c[1]*100}%"></i></div><b>${v==null?'—':v} / ${c[1]}</b></div>`}).join('')}</div>
${m.note?`<div class="card nt"><h3>ملحوظة المسؤول</h3><p>${esc(m.note)}</p></div>`:''}
${t==null?'<p class="mut">لم تُرصد درجاتك بعد. ستظهر هنا بمجرد أن يضيفها المسؤول.</p>':''}
</section>`;
}

function adminView(){
 const n=DB.members.length;
 const rows=[...DB.members].sort(byName).map((m,k)=>{const t=tot(m);return `<tr data-id="${m.id}" data-n="${esc(m.n)} ${m.id}"><td class="c1">${k+1}</td><td class="nm c2">${esc(m.n)}<small>${m.id}</small></td>${CRIT.map((c,i)=>`<td><input type="number" min="0" max="${c[1]}" step="any" aria-label="${c[0]}" value="${m.s[i]??''}" onchange="setS('${m.id}',${i},this)"></td>`).join('')}<td class="tt">${t??''}</td><td class="gp">${t==null?'':gpa(t)}</td><td class="rk">${rank(m)}</td><td><input class="note" aria-label="ملحوظة" value="${esc(m.note||'')}" onchange="setN('${m.id}',this.value)"></td><td><button class="g ic" title="كلمة مرور جديدة" aria-label="كلمة مرور جديدة" onclick="rp('${m.id}')">${IK}</button> <button class="g ic dng" title="حذف" aria-label="حذف" onclick="del('${m.id}')">${IT}</button></td></tr>`}).join('');
 return `<div class="wrap wide">
${FB?'':`<div class="card warn">${IW}<p style="margin:0">التخزين الحالي محلي: البيانات تُحفظ في هذا المتصفح فقط. لمشاركتها مع بقية المسؤولين والأعضاء على أجهزتهم فعّل Firebase (راجع الشرح).</p></div>`}
<div class="card kpis"><div><b id="k1">0</b><span>إجمالي الأعضاء</span></div><div><b id="k2">0</b><span>تم تقييمهم</span></div><div><b id="k3">—</b><span>متوسط المجموع</span></div><div><b id="k4">—</b><span>أعلى مجموع</span></div></div>
<div class="card"><h3>إضافة أعضاء</h3>
<textarea id="nn" rows="2" placeholder="اكتب اسم العضو (أو عدة أسماء، كل اسم في سطر)"></textarea>
<p style="margin-bottom:0"><button onclick="addM()">إضافة وتوليد رقم التسجيل</button></p></div>
<div class="card"><div class="tools"><h3 style="margin:0">الأعضاء (${n})</h3><input type="search" aria-label="بحث" placeholder="بحث بالاسم أو الرقم" oninput="flt(this.value)"><span style="flex:1"></span><button class="g" onclick="csv()">تصدير إلى Excel</button><button class="g" onclick="bk()">نسخة احتياطية</button><button class="g" onclick="$('#rf').click()">استعادة نسخة</button><input id="rf" type="file" accept=".json" hidden onchange="rs(this)"></div>
<div class="tw"><table><thead><tr><th class="c1">#</th><th class="c2">الاسم</th>${CRIT.map(c=>`<th>${c[0]}<br><small>من ${c[1]}</small></th>`).join('')}<th>المجموع</th><th>المعدل</th><th>الترتيب</th><th>ملحوظة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
${n?'':'<p class="mut">لا يوجد أعضاء بعد. أضف أول اسم من الأعلى.</p>'}</div>
<div class="card"><h3>حسابات المسؤولين</h3><div class="chips">${DB.admins.map(a=>`<span class="chip">${esc(a.u)}${a.u===S.id?' <small class="mut">(أنت)</small>':`<button class="g ic dng" title="حذف هذا المسؤول" aria-label="حذف هذا المسؤول" data-u="${esc(a.u)}" onclick="delA(this.dataset.u)">${IT}</button>`}</span>`).join('')}</div>
<p class="mut">لإضافة مسؤول اكتب اسماً جديداً وكلمة مرور، ولتغيير كلمة مرور مسؤول موجود اكتب اسمه وكلمة مرور جديدة (6 أحرف على الأقل).</p>
<div class="tools" style="margin-top:10px"><input id="au" aria-label="اسم المستخدم" placeholder="اسم المستخدم" style="max-width:200px"><input id="ap" type="password" aria-label="كلمة المرور" placeholder="كلمة المرور" style="max-width:200px"><button onclick="addA()">حفظ</button></div></div></div>`;
}

function calc(){DB.members.forEach(m=>{const r=document.querySelector(`tr[data-id="${m.id}"]`);if(!r)return;const t=tot(m);r.querySelector('.tt').textContent=t??'';r.querySelector('.gp').textContent=t==null?'':gpa(t);r.querySelector('.rk').textContent=rank(m)});kpi()}
function kpi(){const ts=DB.members.map(tot).filter(x=>x!=null),s=(i,v)=>{const e=$('#'+i);if(e)e.textContent=v};s('k1',DB.members.length);s('k2',ts.length);s('k3',ts.length?Math.round(ts.reduce((a,b)=>a+b,0)/ts.length*10)/10:'—');s('k4',ts.length?Math.max(...ts):'—')}
function setS(id,i,el){const v=el.value===''?null:Math.min(CRIT[i][1],Math.max(0,+el.value));el.value=v??'';fm(id).s[i]=v;calc();save()}
function setN(id,v){fm(id).note=v;save()}
function flt(q){q=q.trim();document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.dataset.n.includes(q))}
function creds(a){$('#dc').value=a.map(x=>x.join('\t')).join('\n');$('#dlg').showModal()}
async function addM(){
 const ns=$('#nn').value.split('\n').map(x=>x.trim()).filter(Boolean);
 if(!ns.length)return toast('اكتب اسمًا واحدًا على الأقل');
 const out=[];
 for(const n of ns){const p=pw(),id=newId();DB.members.push({id,n,p:await H(p),s:Array(CRIT.length).fill(null),note:''});out.push([n,id,p])}
 await save();render();creds(out);
}
async function rp(id){const m=fm(id),p=pw();m.p=await H(p);await save();creds([[m.n,id,p]])}
async function del(id){const m=fm(id);if(confirm('حذف '+m.n+' نهائيًا؟')){DB.members=DB.members.filter(x=>x!==m);await save();render()}}
async function delA(u){
 if(DB.admins.length<2)return toast('لا يمكن حذف آخر مسؤول');
 if(u===S.id)return toast('لا يمكنك حذف الحساب الذي تستخدمه الآن');
 if(!confirm('حذف المسؤول «'+u+'» نهائياً؟'))return;
 DB.admins=DB.admins.filter(a=>a.u!==u);await save();render();toast('تم حذف المسؤول');
}
async function addA(){
 const u=$('#au').value.trim(),p=$('#ap').value;
 if(!u||p.length<6)return toast('اكتب اسم مستخدم وكلمة مرور من 6 أحرف على الأقل');
 const h=await H(p),a=DB.admins.find(x=>x.u===u);
 if(a)a.p=h;else DB.admins.push({u,p:h});
 await save();render();toast('تم الحفظ');
}
function dl(t,n,y){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:y+';charset=utf-8'}));a.download=n;a.click()}
function csv(){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const h=['رقم التسجيل','الاسم',...CRIT.map(c=>c[0]),'المجموع','المعدل','الترتيب','ملحوظة'];
 const r=[...DB.members].sort(byName).map(m=>{const t=tot(m);return[m.id,m.n,...m.s,t,t==null?'':gpa(t),rank(m),m.note||''].map(q).join(',')});
 dl('\ufeff'+[h.map(q).join(','),...r].join('\r\n'),'تقييم-الأعضاء.csv','text/csv');
}
const bk=()=>dl(JSON.stringify(DB),'backup.json','application/json');
function rs(el){const f=el.files[0];if(!f)return;f.text().then(async t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.members)||!Array.isArray(d.admins))throw 0;DB=d;await save();render();toast('تمت الاستعادة')}catch(e){toast('ملف غير صالح')}})}
V=location.hash=='#login'?'login':'';
window.onpopstate=window.onhashchange=()=>{V=location.hash=='#login'?'login':'';if(!S)render()};
init();
</script>
</body>
</html>
